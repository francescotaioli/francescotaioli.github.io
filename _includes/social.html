
  {%- if site.github_username -%}<a href="https://github.com/{{ site.github_username| cgi_escape | escape }}"><svg class="svg-icon" style="padding-right:0px" alt="github"><use xlink:href="{{ '/assets/minima-social-icons.svg#github' | relative_url }}"></use></svg> </a>{%- endif -%}
  {%- if site.linkedin_username -%}<a href="https://www.linkedin.com/in/{{ site.linkedin_username }}"><svg class="svg-icon" style="padding-right:0px" alt="linkedin"><use xlink:href="{{ '/assets/minima-social-icons.svg#linkedin' | relative_url }}"></use></svg> </a>{%- endif -%}
  {%- if site.twitter_username -%}<a href="https://www.twitter.com/{{ site.twitter_username| cgi_escape | escape }}"><svg class="svg-icon" style="padding-right:0px" alt="linkedin" ><use xlink:href="{{ '/assets/minima-social-icons.svg#twitter' | relative_url }}"></use></svg></a>{%- endif -%}
  {%- if site.scholar -%}<a href=" https://scholar.google.com/{{ site.scholar | escape }}"><img class="svg-icon" style="padding-right:0px" src="/external/Google_Scholar_logo.svg" alt="scholar"> </a>{%- endif -%}
